name: Prepare Release Build

on:
  release:
    types: [created]

permissions:
  contents: write
  id-token: write # Required if your npm package uses modern provenance mapping

jobs:
  build-release-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          # Configures the runner to point to the official npm registry
          registry-url: 'https://npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Archive production artifacts
        run: zip -r dist.zip dist/

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip

      # New Step: Publish directly to the npm Registry
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
