name: Prepare Release Build

on:
  release:
    types: [created]

permissions:
  contents: write # Required to upload assets to the release page

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Step 5: Compress the dist folder into a zip file
      - name: Archive production artifacts
        run: zip -r dist.zip dist/

      # Step 6: Upload the zip archive directly to the release page
      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
